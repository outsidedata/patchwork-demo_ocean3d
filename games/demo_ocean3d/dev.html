<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_ocean3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <script type="module">
      // The demo of ocean3d: index.html, the manager truth and the scenes its row names all in this tab,
      // one seat on them over a loopback, stepped on the page's clock, and a panel holding every
      // number of the sea and the render3d settings that change how it looks or what it costs.
      // `?scene=<scene>` enters that scene. The truths are kept on `window.__scenes` and the page on
      // `window.__page` for the profilers (benchmarking-a-game). The frame rate is three's stats panel,
      // the stats plugin, at the top left.
      //
      // The keys are the testbed's own (devBinds, below), so no click takes the pointer and the panel is
      // clicked freely: W and S fly forward and back, A and D turn left and right, E and Q tilt up and
      // down, Shift climbs and Control sinks, and the wheel, turned anywhere but over the panel, paces.
      //
      // The panel tweaks a copy of the scene's `world.ocean3d`: the sea (the spectrum, the chop, the
      // foam's recovery, the shoaling, the repeat and the weather), the look (the body, the glow, the
      // glint, the foam and its bubbles, the clear shallows), the fixed light, and the disc and the
      // seabed tile. A change is laid into the truth's world and the page's a quarter second after the
      // last one, so the buoys and the boat float on the waves the page draws: a change to a number the
      // spectrum reads makes the spectrum again on both, and a change to the disc or the tile, which the
      // sea reads on its first frame, closes the page's sea so the next frame builds it again. Nothing
      // is written to disk: `copy ocean3d JSON` copies the panel's numbers, for the scene file, and
      // `reset to the file` puts the file's back.
      //
      // The render3d folder: the pixel ratio, drawn smooth or as blocks; the exposure and the tone
      // mapping; the AO's and the bloom's numbers, on their passes as they draw. The AO and the bloom
      // on or off load the page again with `?ao=` and `?bloom=`, since the renderer's reversed depth and
      // its composer are fixed when it is made.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import GUI from 'lil-gui'
      import { sim } from './demo_ocean3d.sim.ts'
      import { scene as open } from './open.sim.ts'
      import file from './demo_ocean3d.scene.json'

      const clone = v => JSON.parse(JSON.stringify(v))
      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The AO and the bloom, on or off from the address, before the renderer is made.
      const r3 = open.prefabs.render3d
      const fileBloom = clone(r3.bloom)
      if (params.has('ao')) r3.ao.on = params.get('ao') === '1'
      if (params.get('bloom') === '0') delete r3.bloom
      // The file's sea, as it was, for `reset to the file`.
      const fileSea = clone(open.world.ocean3d)

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      let client
      // The testbed's own keys, bound in place of whatever the seat's look binds.
      const TURN = 1.4, TILT = 0.9 // radians a second
      let turned = performance.now()
      const devBinds = {
        stick: [{ keys: ['F13', 'F14', 'w', 's'], send: (x, y) => ['stick', x, y] }],
        hold: [
          { keys: ['Shift'], send: v => ['up', v] },
          { keys: ['Control'], send: v => ['down', v] },
        ],
        every: held => {
          const now = performance.now(), dt = Math.min((now - turned) / 1000, 0.1)
          turned = now
          const yaw = (held('a') ? 1 : 0) - (held('d') ? 1 : 0), pitch = (held('q') ? 1 : 0) - (held('e') ? 1 : 0)
          return yaw || pitch ? ['look', yaw * TURN * dt, pitch * TILT * dt] : undefined
        },
        wheel: dy => ['pace', dy],
      }
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        client = me
        const player = me.plugins.player
        if (player) { const bind = player.bind.bind(player); player.bind = () => bind(devBinds) }
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      // The truth of the scene the seat is on.
      const room = () => window.__scenes.get(chosen.scene)

      // The panel: the scene, chosen from the manager's table, the page loaded again on it. Keys typed
      // into it and the wheel turned over it reach neither this page nor the eye, so the wheel scrolls
      // the panel.
      const gui = new GUI({ title: 'demo_ocean3d dev' })
      for (const type of ['keydown', 'keyup', 'wheel']) gui.domElement.addEventListener(type, e => e.stopPropagation())
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => {
        const url = new URL(location.href)
        url.searchParams.set(key, value)
        location.href = url.href
      }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))

      // ---------- the sea ----------

      // The panel's copy of world.ocean3d.
      const sea = clone(fileSea)
      // The disc's and the tile's numbers, read on the sea's first frame.
      const DISC = ['rings', 'segs', 'far', 'depthHalf', 'depthMax', 'depthRes', 'depthRows']
      let built = JSON.stringify(DISC.map(k => sea[k]))
      // The panel's copy laid into the truth's world and the page's a quarter second after the last
      // change, and the page's sea closed when the disc or the tile changed, so it is built again.
      let timer
      const apply = () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          for (const world of [room()?.world, client?.plugins.wire.scene.world]) if (world) Object.assign(world.ocean3d, clone(sea))
          const disc = JSON.stringify(DISC.map(k => sea[k]))
          if (disc !== built) {
            built = disc
            client?.plugins.ocean3d.close()
          }
        }, 250)
      }
      const num = (folder, o, key, lo, hi, step, name) => folder.add(o, key, lo, hi, step).name(name ?? key).onChange(apply)
      const colour = (folder, o, key, name) => folder.addColor(o, key).name(name ?? key).onChange(apply)

      const sf = gui.addFolder('sea')
      num(sf, sea, 'windSpeed', 0.5, 40, 0.1, 'wind speed m/s')
      num(sf, sea, 'windDeg', 0, 360, 1, 'wind toward °')
      num(sf, sea, 'fetchKm', 1, 1000, 1, 'fetch km')
      num(sf, sea, 'swellScale', 0, 2, 0.01, 'swell share')
      num(sf, sea, 'swellDeg', 0, 360, 1, 'swell toward °')
      num(sf, sea, 'amp', 0, 4, 0.01, 'amp (height ×)')
      num(sf, sea, 'chop', 0, 2, 0.01, 'chop (sideways ×)')
      num(sf, sea, 'foamRecovery', 0, 4, 0.01, 'foam recovery')
      num(sf, sea, 'seed', 0, 9999, 1)
      num(sf, sea.patches, 0, 50, 2000, 1, 'patch 0 m')
      num(sf, sea.patches, 1, 5, 400, 1, 'patch 1 m')
      num(sf, sea.patches, 2, 1, 100, 0.5, 'patch 2 m')
      num(sf, sea, 'shoalDepth', 0.1, 50, 0.1, 'shoal depth m')
      num(sf, sea, 'shoalFloor', 0, 1, 0.01, 'shoal floor')
      num(sf, sea, 'repeat', 20, 1000, 1, 'repeat s')
      const wf = sf.addFolder('weather')
      num(wf, sea.weather, 'windRef', 1, 40, 0.1, 'wind for full sea m/s')
      num(wf, sea.weather, 'floor', 0, 1, 0.01, 'sea in no wind')

      const lf = gui.addFolder('look')
      colour(lf, sea, 'deep')
      colour(lf, sea, 'scatter')
      num(lf, sea, 'glow', 0, 3, 0.01)
      num(lf, sea, 'glowPower', 0.5, 32, 0.1, 'glow power')
      num(lf, sea, 'glint', 0, 10, 0.05)
      num(lf, sea, 'glintPower', 1, 2000, 1, 'glint power')
      colour(lf, sea, 'foamColour', 'foam colour')
      num(lf, sea.foamJ, 0, -1, 2, 0.01, 'foam full at J')
      num(lf, sea.foamJ, 1, -1, 2, 0.01, 'foam none at J')
      num(lf, sea, 'bubbles', 0, 10, 0.05, 'bubbles /m')
      num(lf, sea, 'bubbleEdge', 0, 1, 0.01, 'bubble edge')
      num(lf, sea, 'alpha', 0, 1, 0.01)
      num(lf, sea, 'clearDepth', 0.1, 50, 0.1, 'clear depth m')

      const ff = gui.addFolder('fixed light')
      num(ff, sea.light.sun, 0, -1, 1, 0.01, 'sun x')
      num(ff, sea.light.sun, 1, -1, 1, 0.01, 'sun y')
      num(ff, sea.light.sun, 2, -1, 1, 0.01, 'sun z')
      colour(ff, sea.light, 'sunColor', 'sun colour')
      colour(ff, sea.light, 'zenith')
      colour(ff, sea.light, 'horizon')

      const df = gui.addFolder('disc and seabed tile')
      num(df, sea, 'rings', 8, 400, 1)
      num(df, sea, 'segs', 16, 512, 1)
      num(df, sea, 'far', 200, 20000, 10, 'far m')
      num(df, sea, 'depthHalf', 100, 5000, 10, 'tile half m')
      num(df, sea, 'depthMax', 1, 200, 1, 'tile depth max m')
      num(df, sea, 'depthRes', 16, 1024, 1, 'tile texels')
      num(df, sea, 'depthRows', 1, 256, 1, 'tile rows a frame')
      df.close()

      gui.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify(sea, null, 2)) }, 'copy').name('copy ocean3d JSON')
      // The file's numbers written into the panel's copy, key by key, so every slider keeps its object.
      const into = (to, from) => {
        for (const [k, v] of Object.entries(from)) {
          if (v && typeof v === 'object') into(to[k], v)
          else to[k] = v
        }
      }
      gui.add({ reset: () => {
        into(sea, fileSea)
        for (const c of gui.controllersRecursive()) c.updateDisplay()
        apply()
      } }, 'reset').name('reset to the file')

      // ---------- render3d ----------

      const rf = gui.addFolder('render3d')
      const r3d = () => client?.plugins.render3d
      const look = { ratio: r3.pixelRatio ?? 1, blocks: false, exposure: r3.exposure ?? 1, tone: r3.tone ?? 'none' }
      const ratio = () => r3d()?.ratio(look.ratio, look.blocks ? 'blocks' : 'smooth')
      rf.add(look, 'ratio', 0.1, 3, 0.05).name('pixel ratio').onChange(ratio)
      rf.add(look, 'blocks').name('pixels as blocks').onChange(ratio)
      rf.add(look, 'exposure', 0, 4, 0.01).onChange(v => {
        const renderer = r3d()?.renderer
        if (renderer) renderer.toneMappingExposure = v
      })
      rf.add(look, 'tone', ['neutral', 'none']).name('tone mapping').onChange(v => {
        const three = r3d()?.THREE, renderer = r3d()?.renderer
        if (renderer) renderer.toneMapping = v === 'neutral' ? three.NeutralToneMapping : three.NoToneMapping
      })
      // The passes of the composer as it draws: the AO's and the bloom's.
      const passOf = has => r3d()?.composer?.passes.find(has)
      const ao = clone(r3.ao)
      const af = rf.addFolder('ao')
      af.add({ on: !!r3.ao.on }, 'on').onChange(v => reload('ao', v ? '1' : '0'))
      const setAo = () => {
        Object.assign(client.plugins.wire.scene.prefabs.render3d.ao, ao)
        const gtao = passOf(p => 'updateGtaoMaterial' in p)
        if (!gtao) return
        gtao.updateGtaoMaterial({ radius: ao.radius, thickness: ao.thickness, distanceFallOff: ao.falloff, scale: ao.scale, samples: ao.samples })
        gtao.blendIntensity = ao.intensity
      }
      af.add(ao, 'radius', 0.01, 10, 0.01).onChange(setAo)
      af.add(ao, 'thickness', 0.01, 5, 0.01).onChange(setAo)
      af.add(ao, 'falloff', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'scale', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'intensity', 0, 2, 0.01).onChange(setAo)
      af.add(ao, 'samples', 2, 32, 1).onChange(setAo)
      const bloom = clone(fileBloom)
      const bf = rf.addFolder('bloom')
      bf.add({ on: !!r3.bloom }, 'on').onChange(v => reload('bloom', v ? '1' : '0'))
      const setBloom = () => {
        const prefab = client.plugins.wire.scene.prefabs.render3d
        if (prefab.bloom) Object.assign(prefab.bloom, bloom)
        const pass = passOf(p => 'strength' in p && 'threshold' in p)
        if (!pass) return
        pass.strength = bloom.strength
        pass.radius = bloom.radius
        pass.threshold = bloom.threshold
      }
      bf.add(bloom, 'strength', 0, 3, 0.01).onChange(setBloom)
      bf.add(bloom, 'radius', 0, 1, 0.01).onChange(setBloom)
      bf.add(bloom, 'threshold', 0, 10, 0.05).onChange(setBloom)

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is logged, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { console.error(e) }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
